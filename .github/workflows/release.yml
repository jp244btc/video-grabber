name: Build installer

# Pushing a tag like v1.2.3 builds the Windows installer and attaches it to a
# GitHub Release of the same name. "Run workflow" builds it as an artifact
# without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content app.py -Raw), 'VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { throw "app.py says $v but the tag is $tag" }

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrabber-Setup
          path: dist/VideoGrabber-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoGrabber-Setup-*.exe
          generate_release_notes: true
